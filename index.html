<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        function isFetchError(err) {
          if (!err) return false;
          var str = typeof err === 'string' ? err : (err.message || String(err));
          return str.indexOf('fetch') !== -1 && (str.indexOf('getter') !== -1 || str.indexOf('Cannot set property') !== -1);
        }

        // Capture-phase error listener prevents event propagation to external test/preview harnesses
        window.addEventListener('error', function(event) {
          if (isFetchError(event.message) || isFetchError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Global onerror fallback
        var _oldOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if (isFetchError(msg) || isFetchError(error)) {
            return true;
          }
          if (typeof _oldOnError === 'function') {
            return _oldOnError.apply(this, arguments);
          }
          return false;
        };

        // Unhandled promise rejection guard
        window.addEventListener('unhandledrejection', function(event) {
          if (isFetchError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <title>ToolsHub – 100% Client-Side Privacy-First Tools</title>
    <meta name="description" content="Free, privacy-first online tools that process 100% in your browser. Merge PDFs, split pages, convert images, sign forms, and edit documents with zero file uploads." />

    <meta property="og:description" content="Free, privacy-first online tools that process 100% in your browser. Merge PDFs, split pages, convert images, sign forms, and edit documents with zero file uploads." />

    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
